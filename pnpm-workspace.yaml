packages:
  - apps/*
  - apps/smith/server

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
onlyBuiltDependencies:
  - esbuild
  - protobufjs
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  encoding-sniffer: 1.0.2
  node-domexception: link:./vendor/node-domexception
patchedDependencies:
  # The file tree keeps room after its last row (the phone home indicator).
  "@pierre/trees@1.0.0-beta.3": patches/@pierre__trees@1.0.0-beta.3.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
